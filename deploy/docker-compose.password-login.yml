# AREP — TEMPORARY username/password login (ADR-0023).
#
# Lets you check a deployment from a normal browser, outside Telegram.
# docker-compose.yml is left untouched; this file only overlays it.
#
# Usage (from the repository root), together with the other files you use:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.password-login.yml up -d --build
#   docker compose -f docker-compose.yml -f deploy/docker-compose.https.yml -f deploy/docker-compose.password-login.yml up -d --build
#
# Requires in the root .env:
#   LOGIN_USERNAME=...        any username
#   LOGIN_PASSWORD=...        at least 10 characters
#   LOGIN_TELEGRAM_ID=...     your numeric Telegram ID (you log in as that account)
#
# To go back to Telegram-only login: run the same command WITHOUT this file
# (or set PASSWORD_LOGIN_ENABLED=false in .env) and restart.

services:
  backend:
    environment:
      PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-true}
      LOGIN_USERNAME: ${LOGIN_USERNAME:?set LOGIN_USERNAME in .env}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:?set LOGIN_PASSWORD in .env (min 10 characters)}
      LOGIN_TELEGRAM_ID: ${LOGIN_TELEGRAM_ID:?set LOGIN_TELEGRAM_ID in .env}
