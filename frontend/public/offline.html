<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <title>آفلاین — املاک علی‌بابا</title>
    <style>
      :root {
        --bg: #f4f6f9;
        --surface: #ffffff;
        --ink: #111827;
        --muted: #6b7280;
        --line: #e4e7ed;
        --brand: #0d9488;
        --brand-soft: #ccfbf1;
        --gold: #b48d2d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #070b12;
          --surface: #0f1622;
          --ink: #e5eaf2;
          --muted: #8b96a8;
          --line: #232e3f;
          --brand: #2dd4bf;
          --brand-soft: #134e4a;
          --gold: #d6b25e;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: Vazirmatn, system-ui, "Segoe UI", Tahoma, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 28px 22px;
        text-align: center;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05), 0 8px 24px -12px rgb(0 0 0 / 0.12);
      }
      .logo {
        width: 64px; height: 64px; margin: 0 auto 16px;
        border-radius: 22px;
        display: grid; place-items: center;
        background: linear-gradient(135deg, var(--brand), #0f766e);
        color: #fff; font-size: 26px;
      }
      h1 { font-size: 16px; margin: 0 0 6px; }
      p { font-size: 12px; line-height: 2; color: var(--muted); margin: 0 0 18px; }
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--brand-soft); color: var(--brand);
        border-radius: 999px; padding: 4px 12px; font-size: 11px; font-weight: 600;
        margin-bottom: 16px;
      }
      button {
        width: 100%; height: 46px; border: 0; border-radius: 16px;
        background: var(--brand); color: #fff; font-family: inherit;
        font-size: 14px; font-weight: 700; cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }
      button:active { transform: scale(0.97); }
      button:hover { filter: brightness(1.08); }
      .hint { margin-top: 14px; font-size: 10px; color: var(--muted); line-height: 1.9; }
      .gold { color: var(--gold); font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">🏠</div>
      <div class="badge">آفلاین هستید</div>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>
        نگران نباشید — املاکی که قبلاً باز کرده‌اید از حافظه دستگاه نمایش داده می‌شود و
        ثبت‌های جدید شما در <span class="gold">صف همگام‌سازی</span> ذخیره می‌شوند.
      </p>
      <button onclick="window.location.reload()">تلاش مجدد</button>
      <div class="hint">
        پس از وصل شدن اینترنت، از دکمه «همگام‌سازی» در نوار بالای اپ استفاده کنید تا
        موارد در صف ارسال شوند.
      </div>
    </main>
  </body>
</html>
