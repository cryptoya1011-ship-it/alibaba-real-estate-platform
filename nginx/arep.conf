# AREP Production Nginx — Phase 11 verified
# - Serves frontend/dist as SPA
# - Proxies /api/ to backend
# - Handles Deep Links /p/{code} and /d/{code} for SEO
# - OG endpoint /api/v1/public/og/{code} for crawlers
# - Security headers, gzip, caching for PWA assets

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;   # property photos/videos later

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # CSP for Telegram Web App + PWA — adjust as needed
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://telegram.org; frame-ancestors 'self' https://web.telegram.org;" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # API — backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Rate limit headers passthrough
        proxy_pass_header X-RateLimit-Limit;
        proxy_pass_header X-RateLimit-Remaining;
        proxy_pass_header Retry-After;
    }

    # OpenAPI docs via backend (for internal)
    location = /openapi.json { proxy_pass http://backend:8000/openapi.json; }
    location /docs  { proxy_pass http://backend:8000/docs; }
    location /redoc { proxy_pass http://backend:8000/redoc; }

    # Health
    location = /health { proxy_pass http://backend:8000/api/v1/health; }
    location = /api/v1/health { proxy_pass http://backend:8000/api/v1/health; }

    # PWA assets — cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Manifest and Service Worker — no cache or short cache
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    location = /sw.js {
        root /usr/share/nginx/html;
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /workbox-*.js {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /registerSW.js {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Deep Links for SEO — /p/{code} and /d/{code}
    # For crawlers (Telegram, WhatsApp, Googlebot), serve OG HTML from backend
    # For users, serve SPA index.html which handles /p/{code} client-side

    # Map crawler UAs to backend OG endpoint
    # This is a simple approach — in production you might use a more robust bot detection
    location ~ ^/p/([^/]+)/?$ {
        # If crawler, proxy to OG endpoint
        if ($http_user_agent ~* "bot|crawler|spider|facebook|telegram|whatsapp|slack|twitter|linkedin") {
            rewrite ^/p/([^/]+)/?$ /api/v1/public/og/$1 break;
            proxy_pass http://backend:8000;
        }
        # Else serve SPA
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/d/([^/]+)/?$ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Frontend SPA — everything else to index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # No cache for index.html (PWA update)
        location = /index.html {
            root /usr/share/nginx/html;
            expires 0;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
